name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  c:
    name: C
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Configure
        run: >-
          cmake
          -S stm32/Tests
          -B stm32/Tests/.build/ci
          -G Ninja
          -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build stm32/Tests/.build/ci

      - name: Test
        run: >-
          ctest
          --test-dir stm32/Tests/.build/ci
          --output-on-failure
