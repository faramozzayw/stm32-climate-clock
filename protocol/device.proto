syntax = "proto3";

package device;

// Envelope carried by every BLE and framed UART payload.
message DeviceMessage {
  oneof payload {
    DeviceCommand command = 1;
    DeviceTelemetry telemetry = 2;
    BridgeStatus bridge_status = 3;
  }
}

// A command sent from the phone to the STM32 through the ESP32 BLE/UART
// bridge. Exactly one command must be set.
message DeviceCommand {
  oneof command {
    SetMaxTemp set_max_temp = 1;
    SetMinTemp set_min_temp = 2;
    SetCurrentTime set_current_time = 3;
  }
}

message SetMaxTemp {
  // Temperature in tenths of a degree Celsius.
  // Examples: 250 means 25.0 C and 155 means 15.5 C.
  // Valid range: -32768..32767 (int16). Receivers must reject values outside it.
  sint32 value = 1;
}

message SetMinTemp {
  // Temperature in tenths of a degree Celsius.
  // Examples: 250 means 25.0 C and 155 means 15.5 C.
  // Valid range: -32768..32767 (int16). Receivers must reject values outside it.
  sint32 value = 1;
}

message SetMaxHumidity {
  sint32 value = 1;
}

message SetMinHumidity {
  sint32 value = 1;
}

message SetCurrentTime {
  // Current time in milliseconds.
  uint64 value_ms = 1;
}

message DeviceTelemetry {
  // Temperature in tenths of a degree Celsius.
  sint32 current_temp = 1;
  // Configured minimum temperature in tenths of a degree Celsius.
  sint32 min_temp = 2;
  // Configured maximum temperature in tenths of a degree Celsius.
  sint32 max_temp = 3;
}

enum BleConnectionState {
  BLE_CONNECTION_STATE_DISCONNECTED = 0;
  BLE_CONNECTION_STATE_CONNECTING = 1;
  BLE_CONNECTION_STATE_CONNECTED = 2;
  BLE_CONNECTION_STATE_DISCONNECTING = 3;
}

// BLE connection state reported by the ESP32 bridge to the STM32.
message BridgeStatus {
  BleConnectionState ble_connection_state = 1;
}
