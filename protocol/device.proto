syntax = "proto3";

package device;

// Envelope carried by every BLE and framed UART payload.
message DeviceMessage {
  oneof payload {
    DeviceCommand command = 1;
    DeviceTelemetry telemetry = 2;
    BridgeStatus bridge_status = 3;
  }
}

// A command sent from a client device to the STM32 through the ESP32 BLE/UART
// bridge. Exactly one command must be set.
message DeviceCommand {
  oneof command {
    SetMaxTemp set_max_temp = 1;
    SetMinTemp set_min_temp = 2;
    SetCurrentTime set_current_time = 3;
    SetTemperatureUnit set_temperature_unit = 4;
    SetMaxHumidity set_max_humidity = 5;
    SetMinHumidity set_min_humidity = 6;
  }
}

message SetMaxTemp {
  // Temperature in tenths of a degree Celsius.
  // Examples: 250 means 25.0 C and 155 means 15.5 C.
  // Valid range: -32768..32767 (int16). Receivers must reject values outside it.
  sint32 value = 1;
}

message SetMinTemp {
  // Temperature in tenths of a degree Celsius.
  // Examples: 250 means 25.0 C and 155 means 15.5 C.
  // Valid range: -32768..32767 (int16). Receivers must reject values outside it.
  sint32 value = 1;
}

message SetMaxHumidity {
  // Relative humidity in tenths of a percent. Valid range: 0..1000.
  uint32 value = 1;
}

message SetMinHumidity {
  // Relative humidity in tenths of a percent. Valid range: 0..1000.
  uint32 value = 1;
}

message SetCurrentTime {
  // Current time in milliseconds.
  uint64 value_ms = 1;
}

enum TemperatureUnit {
  TEMPERATURE_UNIT_CELSIUS = 0;
  TEMPERATURE_UNIT_FAHRENHEIT = 1;
}

message SetTemperatureUnit {
  TemperatureUnit unit = 1;
}

message DeviceTelemetry {
  oneof data {
    EnvironmentMeasurement measurement = 1;
    DeviceSettings settings = 2;
  }
}

message EnvironmentMeasurement {
  // Temperature in tenths of a degree Celsius.
  sint32 temperature_tenths_celsius = 1;
  // Relative humidity in thousandths of a percent.
  optional uint32 humidity_milli_percent = 2;
}

message DeviceSettings {
  // Configured minimum temperature in tenths of a degree Celsius.
  sint32 min_temperature_tenths_celsius = 1;
  // Configured maximum temperature in tenths of a degree Celsius.
  sint32 max_temperature_tenths_celsius = 2;
  // Configured minimum relative humidity in tenths of a percent.
  uint32 min_humidity_tenths_percent = 3;
  // Configured maximum relative humidity in tenths of a percent.
  uint32 max_humidity_tenths_percent = 4;
  // Unit selected on the device and stored in EEPROM.
  TemperatureUnit temperature_unit = 5;
}

enum BleConnectionState {
  BLE_CONNECTION_STATE_DISCONNECTED = 0;
  BLE_CONNECTION_STATE_CONNECTING = 1;
  BLE_CONNECTION_STATE_CONNECTED = 2;
  BLE_CONNECTION_STATE_DISCONNECTING = 3;
}

// BLE connection state reported by the ESP32 bridge to the STM32.
message BridgeStatus {
  BleConnectionState ble_connection_state = 1;
}
